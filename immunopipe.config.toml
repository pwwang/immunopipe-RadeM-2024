
[SampleInfo.in]
infile = ["data/samples.txt"]

[SampleInfo.envs.stats.Sample_Timepoint]
plot_type = "bar"
x = "Timepoint"

[SampleInfo.envs.stats.Sample_Tissue]
plot_type = "bar"
x = "Tissue"

[SeuratPreparing.envs]
# ncores = 4
cell_qc = "nFeature_RNA > 200 & percent.mt < 10 & percent.ribo > 5"
gene_qc = { min_cells = 0, excludes = ["^TR(A|B|D|G)V$", "^IG.V$"] }
# reuse the output from the unsupervised pipeline
cache = "./cache"
doublet_detector = "scDblFinder"
use_sct = true
contam_correction = "decontX"

[SeuratPreparing.envs.IntegrateLayers]
method = "rpca"

[SeuratClustering.envs.FindClusters]
resolution = ["0.2:1.0", "0.3"]

[ModuleScoreCalculator.envs.modules.ModuleScore]
features = ["FCGR3A", "CD14", "SIRPA", "CD68", "SLAMF7", "FAP", "TNFRSF17", "CD47", "SDC1"]

