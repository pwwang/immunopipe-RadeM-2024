[SeuratClusterStats.plugin_opts]
report_paging = 8

[SeuratClusterStats.envs]
cache = "./cache"

[SeuratClusterStats.envs.stats.'Number of cells in each cluster (bar)']
x_text_angle = 90

[SeuratClusterStats.envs.stats.'Number of cells in each cluster (pie)']
plot_type = "pie"

[SeuratClusterStats.envs.stats.'Number of cells in each cluster by Sample']
x_text_angle = 90
group_by = "Sample"
save_data = true

[SeuratClusterStats.envs.stats.'Number of cells in each cluster by Timepoint']
group_by = "Timepoint"
x_text_angle = 90

[SeuratClusterStats.envs.stats.'Fraction of cells in each cluster by Timepoint']
group_by = "Timepoint"
save_data = true
x_text_angle = 90
frac = "group"

[SeuratClusterStats.envs.stats.'Number of cells in each cluster by Tissue']
group_by = "Tissue"
x_text_angle = 90

[SeuratClusterStats.envs.stats.'Fraction of cells in each cluster by Tissue']
group_by = "Tissue"
save_data = true
x_text_angle = 90
frac = "group"

[SeuratClusterStats.envs.stats.'Fraction of cells in each cluster by Timepoint (stacked)']
group_by = "Timepoint"
save_data = true
x_text_angle = 90
position = "stack"
frac = "group"
swap = true

[SeuratClusterStats.envs.stats.'Fraction of cells in each cluster by Tissue (stacked)']
group_by = "Tissue"
save_data = true
x_text_angle = 90
position = "stack"
frac = "group"
swap = true

[SeuratClusterStats.envs.stats.'Fraction of cells in each cluster by Timepoint (violin)']
group_by = ["Sample", "Timepoint"]
x_text_angle = 90
frac = "group"
plot_type = "violin"
comparisons = true
sig_label = "p.format"
add_point = true
aspect_ratio = 0.25
devpars = {width = 1500, height = 600}

[SeuratClusterStats.envs.stats.'Fraction of cells in each cluster by Tissue (violin)']
group_by = ["Sample", "Tissue"]
x_text_angle = 90
frac = "group"
plot_type = "violin"
comparisons = true
sig_label = "p.format"
add_point = true
aspect_ratio = 0.25
devpars = {width = 1500, height = 600}

