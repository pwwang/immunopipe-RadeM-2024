# Reference mapping with Seurat::MapQuery (replaces the deprecated SeuratMap2Ref
# process). Three cases reproduce the three label columns the downstream
# SeuratClusterStats sections use -- `celltype`, `predicted.celltype_l2` and
# `predicted.celltype_l3`; `add_prefix = false` keeps those names unprefixed.
# The reference is a plain-RNA Harmony object: pca anchors, `umap` is the only
# reduction carrying a UMAP model to project onto, LogNormalize normalization.
[CellTypeAnnotation.envs]
add_prefix = false
cache = "./cache"

  [CellTypeAnnotation.envs.cases.celltype]
  tool = "mapquery"
  anno_col = "celltype"
  set_ident = true

    [CellTypeAnnotation.envs.cases.celltype.mapquery]
    db = "data/seurat_harmony_pub.rds"
    use = "celltype"
    refnorm = "LogNormalize"
    ident_name = "celltype"

      [CellTypeAnnotation.envs.cases.celltype.mapquery.find_transfer_anchors]
      "reference.reduction" = "pca"
      dims = 30
      "normalization.method" = "LogNormalize"

      [CellTypeAnnotation.envs.cases.celltype.mapquery.map_query]
      "reference.reduction" = "pca"
      "reduction.model" = "umap"

  [CellTypeAnnotation.envs.cases.celltype_l2]
  tool = "mapquery"
  anno_col = "predicted.celltype_l2"
  set_ident = false

    [CellTypeAnnotation.envs.cases.celltype_l2.mapquery]
    db = "data/seurat_harmony_pub.rds"
    use = "celltype_short_2"
    refnorm = "LogNormalize"
    ident_name = "predicted.celltype_l2"

      [CellTypeAnnotation.envs.cases.celltype_l2.mapquery.find_transfer_anchors]
      "reference.reduction" = "pca"
      dims = 30
      "normalization.method" = "LogNormalize"

      [CellTypeAnnotation.envs.cases.celltype_l2.mapquery.map_query]
      "reference.reduction" = "pca"
      "reduction.model" = "umap"

  [CellTypeAnnotation.envs.cases.celltype_l3]
  tool = "mapquery"
  anno_col = "predicted.celltype_l3"
  set_ident = false

    [CellTypeAnnotation.envs.cases.celltype_l3.mapquery]
    db = "data/seurat_harmony_pub.rds"
    use = "celltype_short_3"
    refnorm = "LogNormalize"
    ident_name = "predicted.celltype_l3"

      [CellTypeAnnotation.envs.cases.celltype_l3.mapquery.find_transfer_anchors]
      "reference.reduction" = "pca"
      dims = 30
      "normalization.method" = "LogNormalize"

      [CellTypeAnnotation.envs.cases.celltype_l3.mapquery.map_query]
      "reference.reduction" = "pca"
      "reduction.model" = "umap"

